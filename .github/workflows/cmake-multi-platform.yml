name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}

    strategy:
      # Set fail-fast to false to ensure that feedback is delivered for all matrix combinations. Consider changing this to true when your workflow is stable.
      fail-fast: false

      matrix:
        include:
          - name: MSVC Win32
            os: windows-latest
            c_compiler: cl
            cpp_compiler: cl
            architecture: Win32
          - name: MSVC x64
            os: windows-latest
            c_compiler: cl
            cpp_compiler: cl
            architecture: x64
          - name: MSVC arm64
            # native arm64 runner, so the tests can actually run
            os: windows-11-arm
            c_compiler: cl
            cpp_compiler: cl
            architecture: arm64
          - name: Ubuntu GCC
            os: ubuntu-latest
            c_compiler: gcc
            cpp_compiler: g++
          - name: Ubuntu Clang
            os: ubuntu-latest
            c_compiler: clang
            cpp_compiler: clang++
          - name: Ubuntu arm64 GCC
            # non-Apple arm64 uses the struct JSValue representation (same as MSVC x64), not NaN-boxing
            os: ubuntu-24.04-arm
            c_compiler: gcc
            cpp_compiler: g++
          - name: macOS Clang
            os: macos-latest
            c_compiler: clang
            cpp_compiler: clang++

    steps:
    - uses: actions/checkout@v4

    - name: Set reusable strings
      # Turn repeated input strings (such as the build output directory) into step outputs. These step outputs can be used throughout the workflow file.
      id: strings
      shell: bash
      run: |
        echo "build-output-dir=${{ github.workspace }}/build" >> "$GITHUB_OUTPUT"

    - name: Configure CMake (Windows)
      if: success() && matrix.cpp_compiler == 'cl'
      # Configure CMake in a 'build' subdirectory. `CMAKE_BUILD_TYPE` is only required if you are using a single-configuration generator such as make.
      # See https://cmake.org/cmake/help/latest/variable/CMAKE_BUILD_TYPE.html?highlight=cmake_build_type
      run: >
        cmake -B ${{ steps.strings.outputs.build-output-dir }}
        -DCMAKE_CXX_COMPILER=${{ matrix.cpp_compiler }}
        -DCMAKE_C_COMPILER=${{ matrix.c_compiler }}
        -DCMAKE_BUILD_TYPE=Release
        -A ${{ matrix.architecture }}
        -S ${{ github.workspace }}

    - name: Configure CMake (Others)
      if: success() && matrix.cpp_compiler != 'cl'
      # Configure CMake in a 'build' subdirectory. `CMAKE_BUILD_TYPE` is only required if you are using a single-configuration generator such as make.
      # See https://cmake.org/cmake/help/latest/variable/CMAKE_BUILD_TYPE.html?highlight=cmake_build_type
      run: >
        cmake -B ${{ steps.strings.outputs.build-output-dir }}
        -DCMAKE_CXX_COMPILER=${{ matrix.cpp_compiler }}
        -DCMAKE_C_COMPILER=${{ matrix.c_compiler }}
        -DCMAKE_BUILD_TYPE=Release
        -S ${{ github.workspace }}

    - name: Build
      # Build your program with the given configuration. Note that --config is needed because the default Windows generator is a multi-config generator (Visual Studio generator).
      run: cmake --build ${{ steps.strings.outputs.build-output-dir }} --config Release

    - name: Test
      # Note that -C is needed because the default Windows generator is a multi-config generator (Visual Studio generator).
      run: ctest --test-dir ${{ steps.strings.outputs.build-output-dir }} --build-config Release --output-on-failure

  emscripten:
    name: Emscripten (latest)
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Install Emscripten SDK
      run: |
        git clone --depth 1 https://github.com/emscripten-core/emsdk.git "${{ runner.temp }}/emsdk"
        "${{ runner.temp }}/emsdk/emsdk" install latest
        "${{ runner.temp }}/emsdk/emsdk" activate latest

    - name: Configure, build & test
      # The Emscripten toolchain sets CMAKE_CROSSCOMPILING_EMULATOR to node, so ctest runs the tests under node
      run: |
        source "${{ runner.temp }}/emsdk/emsdk_env.sh"
        emcc --version
        emcmake cmake -B build -DCMAKE_BUILD_TYPE=Release -S "${{ github.workspace }}"
        cmake --build build
        ctest --test-dir build --output-on-failure
